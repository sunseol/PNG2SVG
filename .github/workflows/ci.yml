name: SlideRefine CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python package
        run: python -m pip install -e ".[dev]" build
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Ruff
        run: python -m ruff check src tests tools vectorize_ppt_svg.py
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest tests/unit tests/contract tests/integration tests/mcp tests/security -q
      - name: Web contract
        working-directory: apps/web
        run: npm test
      - name: Web browser E2E
        working-directory: apps/web
        run: npm run test:e2e
      - name: Build package
        run: python -m build
      - name: Generate evidence bundle
        run: python -m tools.generate_evidence --evidence evidence/${{ env.EVIDENCE_SHA }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: evidence/${{ env.EVIDENCE_SHA }}
